<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogAnalyzer-AI — Log File Analyzer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
  <header class="app-header">
    <h1>📊 LogAnalyzer-AI</h1>
    <p class="subtitle">Intelligent Log File Analysis & Pattern Detection</p>
  </header>

  <div class="upload-zone" id="uploadZone">
    <div class="upload-icon">📁</div>
    <p>Drag & drop a <strong>.log</strong> or <strong>.txt</strong> file here</p>
    <p class="upload-hint">or click to browse</p>
    <input type="file" id="fileInput" accept=".log,.txt" style="display:none">
  </div>

  <div class="stats-bar" id="statsBar" style="display:none">
    <div class="stat-card">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">Total Entries</div>
    </div>
    <div class="stat-card stat-error">
      <div class="stat-value" id="statError">0</div>
      <div class="stat-label">ERROR</div>
    </div>
    <div class="stat-card stat-warn">
      <div class="stat-value" id="statWarn">0</div>
      <div class="stat-label">WARN</div>
    </div>
    <div class="stat-card stat-info">
      <div class="stat-value" id="statInfo">0</div>
      <div class="stat-label">INFO</div>
    </div>
    <div class="stat-card stat-debug">
      <div class="stat-value" id="statDebug">0</div>
      <div class="stat-label">DEBUG</div>
    </div>
  </div>

  <div class="controls" id="controlsPanel" style="display:none">
    <div class="control-row">
      <div class="filter-group">
        <label>Level Filter:</label>
        <div class="level-toggles">
          <button class="level-btn active" data-level="ERROR" onclick="toggleLevel(this)">ERROR</button>
          <button class="level-btn active" data-level="WARN" onclick="toggleLevel(this)">WARN</button>
          <button class="level-btn active" data-level="INFO" onclick="toggleLevel(this)">INFO</button>
          <button class="level-btn active" data-level="DEBUG" onclick="toggleLevel(this)">DEBUG</button>
        </div>
      </div>
      <div class="search-group">
        <input type="text" id="searchInput" placeholder="🔍 Search logs..." oninput="applyFilters()">
        <button class="btn btn-small" onclick="clearSearch()">Clear</button>
      </div>
    </div>
    <div class="control-row">
      <div class="tabs-toolbar">
        <button class="tab active" onclick="switchView('logs', this)">📋 Log Entries</button>
        <button class="tab" onclick="switchView('timeline', this)">📈 Timeline</button>
        <button class="tab" onclick="switchView('patterns', this)">🔍 Patterns</button>
        <button class="tab" onclick="switchView('clusters', this)">🧩 Clusters</button>
      </div>
      <div class="export-group">
        <button class="btn btn-small" onclick="exportLogs()">💾 Export Filtered</button>
        <button class="btn btn-small btn-danger" onclick="clearAll()">🗑️ Clear</button>
      </div>
    </div>
  </div>

  <!-- Log Entries View -->
  <div id="view-logs" class="view active">
    <div class="log-list" id="logList">
      <p class="placeholder">Upload a log file to begin analysis.</p>
    </div>
  </div>

  <!-- Timeline View -->
  <div id="view-timeline" class="view">
    <div class="timeline-container" id="timelineContainer">
      <canvas id="timelineCanvas" width="1200" height="300"></canvas>
    </div>
    <div class="timeline-legend" id="timelineLegend"></div>
  </div>

  <!-- Patterns View -->
  <div id="view-patterns" class="view">
    <div class="patterns-panel" id="patternsPanel">
      <p class="placeholder">Upload a log file to detect patterns.</p>
    </div>
  </div>

  <!-- Clusters View -->
  <div id="view-clusters" class="view">
    <div class="clusters-panel" id="clustersPanel">
      <p class="placeholder">Upload a log file to see error clusters.</p>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
